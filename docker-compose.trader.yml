# Add to ~/portfolio-manager: COMPOSE_FILE=docker-compose.yml:docker-compose.trader.yml in .env.
# Reads the same data/ the dashboard reads; writes data/trade-suggestions.json.
services:
  trader:
    image: ghcr.io/justintimefordinner-lang/portfolio-trader:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      TZ: ${TZ:-America/Denver}
    volumes:
      - ./trader-state:/state
      - ./data:/app/data
